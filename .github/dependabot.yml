---
version: 2
updates:
  # Python dependencies (uv.lock). Dev group is auto-merged by
  # dependabot-automerge.yml; runtime dependencies are reviewed by hand.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "atheris"
        # atheris requires clang/libfuzzer to build from source
        # It's only used for optional fuzzing (not production)
        # CIFuzz workflow has proper build tools configured
    groups:
      # Security fixes for runtime dependencies. Reviewed and merged by hand;
      # merging triggers a patch release (security-release.yml).
      security-deps:
        applies-to: security-updates
        dependency-type: "production"
        patterns:
          - "*"
      package-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
      package-deps:
        dependency-type: "production"
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 5
    groups:
      actions-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Enable version updates for pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    groups:
      pre-commit-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 7
