---
# Starts a patch release when a Dependabot security-updates PR for runtime
# dependencies (group "security-deps" in dependabot.yml) has been merged.
# The PR itself is reviewed and merged by hand; only the release is automatic.
name: Security patch release

"on":
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Dispatch patch release
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run
      pull-requests: read # find the PR that produced this commit
    steps:
      - name: Dispatch release workflow if a security PR was merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # PRs associated with the commit pushed to main (the merge/squash commit)
          match=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '
            [.[] | select(
              .merged_at != null
              and .user.login == "dependabot[bot]"
              and (.head.ref | startswith("dependabot/uv/security-deps-"))
            ) | .html_url] | first // empty')
          if [ -z "$match" ]; then
            echo "No merged Dependabot security PR for ${SHA}; nothing to release."
            exit 0
          fi
          echo "::notice::Security PR merged (${match}); starting patch release"
          gh workflow run release.yml --repo "$REPO" --ref main -f bump_type=patch
