---
name: Test Python Versions

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'mkdocs.yml'
      - 'config.toml.example'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'mkdocs.yml'
      - 'config.toml.example'

permissions:
  contents: read

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine uv cache directory
        id: uv-cache-dir
        run: |
          echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting with ruff
        run: uv run ruff check miniflux_tui tests

      - name: Type check with pyright
        run: uv run pyright miniflux_tui tests

      - name: Run tests with coverage
        run: |
          uv run pytest tests --cov=miniflux_tui --cov-report=xml \
            --cov-report=term-missing --cov-report=html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
          retention-days: 7

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@643bc377ffa44ace6394b2b5d0d3950076de9f63 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage.xml
          format: cobertura
          flag-name: ${{ matrix.os }}-py${{ matrix.python-version }}
          parallel: true

      - name: Coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@f6e43d10db49c1d7f8e475b8f0097d03feab6ac0 # v3.31
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          threshold = 55.0
          coverage = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100

          if coverage < threshold:
              sys.exit(f"Coverage {coverage:.2f}% is below threshold {threshold:.0f}%")

          print(f"Coverage {coverage:.2f}% meets threshold {threshold:.0f}%")
          PY

  test-future:
    name: Test Python 3.15 (Preview)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine uv cache directory
        id: uv-cache-dir
        run: |
          echo "dir=$(uv cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.uv-cache-dir.outputs.dir }}
          key: uv-${{ runner.os }}-3.15-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.15-

      - name: Set up Python 3.15
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting with ruff
        run: uv run ruff check miniflux_tui tests

      - name: Type check with pyright
        run: uv run pyright miniflux_tui tests

      - name: Run tests with coverage
        run: |
          uv run pytest tests --cov=miniflux_tui --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check coverage threshold
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          threshold = 55.0
          coverage = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100

          if coverage < threshold:
              sys.exit(f"Coverage {coverage:.2f}% is below threshold {threshold:.0f}%")

          print(f"Coverage {coverage:.2f}% meets threshold {threshold:.0f}%")
          PY

  coverage-finish:
    name: Finish Coveralls
    needs: [test, test-future]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Coveralls Finished
        uses: coverallsapp/github-action@643bc377ffa44ace6394b2b5d0d3950076de9f63 # v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  coverage-report:
    name: Generate Coverage Report
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-data

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install coverage tools
        run: uv pip install coverage

      - name: Combine coverage reports
        run: |
          cd coverage-data
          uv run coverage combine --keep
          uv run coverage xml -o ../coverage.xml
          uv run coverage html --directory=../htmlcov

      - name: Deploy coverage HTML to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./htmlcov
          destination_dir: coverage
          enable_jekyll: false
