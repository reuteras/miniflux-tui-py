---
name: Container Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: { }

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/miniflux-tui

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Compute image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          tags=""

          # Release tags (v0.5.0, v1.0.0, etc)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ref_name="${GITHUB_REF#refs/tags/}"
            tags="${REGISTRY}/${IMAGE_NAME}:${ref_name}"
            tags+=$'\n'"${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          {
            printf 'tags<<EOF\n'
            printf '%s\n' "$tags"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        env:
          # renovate: datasource=github-releases depName=sigstore/cosign
          COSIGN_VERSION: v2.4.3
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${COSIGN_VERSION}" \
            -R sigstore/cosign \
            --pattern "cosign-linux-amd64" \
            -D /tmp/cosign/
          install -m 0755 /tmp/cosign/cosign-linux-amd64 /usr/local/bin/cosign

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
