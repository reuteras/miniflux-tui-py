---
name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eac61b7dd658bcc54afd3a4e8f4d7d4d9c17fd34  # v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@3db3e63e9a01d3aa34f5ae21d1b60c959d2e4970  # v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build documentation
        run: uv run mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@b4b15b8c7c6c4c70e8c66542b10fb5b81b0f8397  # v4
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164dcc165e23c9f3652ca63dc574474af8  # v4
