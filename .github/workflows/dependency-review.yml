---
# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'fuzz/**'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Python-specific vulnerability scan with pip-audit
        continue-on-error: true
        run: |
          uv pip install pip-audit
          {
            echo "## pip-audit Vulnerability Scan"
            echo ""
            echo "Python-specific vulnerability scanning results:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          uv run pip-audit --desc --format json --output audit.json || true
          # Display summary
          if [ -f audit.json ]; then
            echo "✅ pip-audit scan completed" >> "$GITHUB_STEP_SUMMARY"
            # Count vulnerabilities if any
            vuln_count=$(jq '.dependencies | length' audit.json 2>/dev/null || echo "0")
            echo "- Dependencies scanned: $vuln_count" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
        with:
          name: pip-audit-results
          path: audit.json
          retention-days: 90
