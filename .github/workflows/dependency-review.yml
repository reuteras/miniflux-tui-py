---
# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'fuzz/**'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Python-specific vulnerability scan with pip-audit
        continue-on-error: true
        run: |
          uv pip install pip-audit
          {
            echo "## pip-audit Vulnerability Scan"
            echo ""
            echo "Python-specific vulnerability scanning results:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          uv run pip-audit --desc --format json --output audit.json || true
          # Display summary
          if [ -f audit.json ]; then
            echo "✅ pip-audit scan completed" >> "$GITHUB_STEP_SUMMARY"
            # Count vulnerabilities if any
            vuln_count=$(jq '.dependencies | length' audit.json 2>/dev/null || echo "0")
            echo "- Dependencies scanned: $vuln_count" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: pip-audit-results
          path: audit.json
          retention-days: 90
