---
name: CIFuzz

on:
  pull_request:
    paths:
      - 'miniflux_tui/**'
      - 'fuzz/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  fuzzing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install Clang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm

      - name: Build Fuzzers
        run: uv sync --locked --group fuzz --python 3.11

      - name: Run Fuzzers
        run: |
          mkdir -p fuzz/artifacts
          uv run --python 3.11 python fuzz/fuzz_config.py -max_total_time=60 -rss_limit_mb=2048

      - name: Upload Crash Artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
