---
name: CIFuzz

on:
  pull_request:
    paths:
      - 'miniflux_tui/**'
      - 'fuzz/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  fuzzing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        run: uv python install 3.11

      - name: Install Clang toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm

      - name: Build Fuzzers
        run: uv sync --locked --group fuzz --python 3.11

      - name: Run Fuzzers
        run: |
          mkdir -p fuzz/artifacts
          uv run --python 3.11 python fuzz/fuzz_config.py -max_total_time=60 -rss_limit_mb=2048

      - name: Upload Crash Artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
