---
name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting with ruff
        run: uv run ruff check miniflux_tui tests

      - name: Type check with pyright
        run: uv run pyright miniflux_tui tests

      - name: Run tests
        run: uv run pytest tests --cov=miniflux_tui

      - name: Build distribution
        run: uv build

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/miniflux-tui-py/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
        with:
          persist-credentials: false

      - name: Download artifacts
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
          attestations: true

  binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group binary --locked

      - name: Build executable archive
        run: uv run python scripts/build_binary.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: miniflux-tui-${{ matrix.os }}
          path: build/binary/*
          retention-days: 7

  release:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
        with:
          persist-credentials: false

      - name: Download artifacts
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist/

      - name: Download binary artifacts
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: miniflux-tui-*
          merge-multiple: true
          path: binaries/

      - name: Install Syft
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SYFT_VERSION=v1.36.0
          SYFT_BASE_URL="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          SYFT_ARCHIVE="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          TMP_DIR="$(mktemp -d)"
          ARCHIVE_PATH="${TMP_DIR}/syft.tar.gz"

          if ! curl -sSfL "${SYFT_BASE_URL}/${SYFT_ARCHIVE}" -o "${ARCHIVE_PATH}"; then
            ALT_ARCHIVE="syft_Linux_x86_64.tar.gz"
            curl -sSfL "${SYFT_BASE_URL}/${ALT_ARCHIVE}" -o "${ARCHIVE_PATH}"
          fi

          sudo tar -xz -f "${ARCHIVE_PATH}" -C /usr/local/bin syft
          rm -rf "${TMP_DIR}"

      - name: Generate SBOMs for release artifacts
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p sbom
          syft dir:dist -o cyclonedx-json --file sbom/miniflux-tui-pypi.cdx.json
          syft dir:dist -o spdx-json --file sbom/miniflux-tui-pypi.spdx.json
          syft dir:binaries -o cyclonedx-json --file sbom/miniflux-tui-binaries.cdx.json
          syft dir:binaries -o spdx-json --file sbom/miniflux-tui-binaries.spdx.json

      - name: Upload SBOM artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom
          path: sbom/
          retention-days: 7

      - name: Generate GitHub attestations
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2.0.0
        with:
          subject-path: |
            dist/*
            binaries/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2
        with:
          draft: false
          prerelease: false
          files: |
            dist/**
            binaries/*
            sbom/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
