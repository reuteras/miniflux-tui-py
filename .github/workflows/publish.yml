---
name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eac61b7dd658bcc54afd3a4e8f4d7d4d9c17fd34  # v5

      - name: Install uv
        uses: astral-sh/setup-uv@3db3e63e9a01d3aa34f5ae21d1b60c959d2e4970  # v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with ruff
        run: uv run ruff check miniflux_tui tests

      - name: Type check with pyright
        run: uv run pyright miniflux_tui tests

      - name: Run tests
        run: uv run pytest tests --cov=miniflux_tui

      - name: Build distribution
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a  # v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/miniflux-tui-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@eac61b7dd658bcc54afd3a4e8f4d7d4d9c17fd34  # v5

      - name: Download artifacts
        uses: actions/download-artifact@65a9edc5881444af866a97fb08d01f43a695e0f8  # v6
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@f7600c2b9b8c6f5f8e8f8c8f5a8e5a8e5a8e5a8e  # release/v1
        with:
          packages-dir: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@eac61b7dd658bcc54afd3a4e8f4d7d4d9c17fd34  # v5

      - name: Download artifacts
        uses: actions/download-artifact@65a9edc5881444af866a97fb08d01f43a695e0f8  # v6
        with:
          name: dist
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2
        with:
          draft: false
          prerelease: false
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
