---
name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Analyze GitHub Actions Workflows
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF results to Advanced Security
      security-events: write
      # Required for private repositories
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor security analysis
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          # Disable online audits to avoid cross-repo API calls with limited token scope
          online-audits: false
          # Use regular persona (not pedantic)
          persona: regular
          # Colorize output for better readability
          color: true
          # Explicit token for GitHub API access
          token: ${{ secrets.GITHUB_TOKEN }}
