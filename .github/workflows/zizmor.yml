---
name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Analyze GitHub Actions Workflows
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF results to Advanced Security
      security-events: write
      # Required for private repositories
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor security analysis
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # Disable online audits to avoid cross-repo API calls with limited token scope
          online-audits: false
          # Use regular persona (not pedantic)
          persona: regular
          # Colorize output for better readability
          color: true
          # Explicit token for GitHub API access
          token: ${{ secrets.GITHUB_TOKEN }}
