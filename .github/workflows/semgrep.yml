---
name: Semgrep Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'miniflux_tui/**'
      - 'tests/**'
      - '.github/workflows/semgrep.yml'
  pull_request:
    branches: [main]
    paths:
      - 'miniflux_tui/**'
      - 'tests/**'
      - '.github/workflows/semgrep.yml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Semgrep CLI
        run: |
          # Pin pip with hash for supply chain security
          # Hash from https://pypi.org/project/pip/24.3.1/
          python -m pip install --upgrade pip==24.3.1 \
            --require-hashes \
            --hash=sha256:3790624780082365f47549d032f3770eeb2b1e8bd1f7b2e02dace1afa361b4ed

          # Pin semgrep with hash for supply chain security
          # All hashes from https://pypi.org/project/semgrep/1.93.0/ (all platform wheels)
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes \
            semgrep==1.93.0 \
            --hash=sha256:41c3df47c84e2ef064becad233bf619d98824f46787109a7e247fa1266429732 \
            --hash=sha256:40ae350c75fa7b8ea949f815b1afc9709449a5a2cc9659c79e1f983a400342db \
            --hash=sha256:d021e4513fcff7a60cdc4541c443212b5a8165d1e8f49abd8661ab685607dd34 \
            --hash=sha256:cde7d4c42a579359f37f3ef19cc04f91886903381ba3cff6ce0d90ea3ca80676 \
            --hash=sha256:b97fd47b303ca1ba6f85a1b50428093b987126d8e4aa7422e5acdcc3787c6628

      - name: Run Semgrep
        run: |
          semgrep scan \
            --sarif --output semgrep.sarif \
            --config p/security-audit \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/command-injection \
            --config p/secrets

      - name: Upload SARIF file to GitHub Security
        uses: github/codeql-action/upload-sarif@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3.31.0
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
