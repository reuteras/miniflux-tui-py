---
name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd719bcc41092186ec7271e2924ecd7d5c6e7e  # main

      - name: Initialize CodeQL
        uses: github/codeql-action/init@461b3a0906d1a6b1c92f1f21cd4a06b0b24e6a6e  # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@461b3a0906d1a6b1c92f1f21cd4a06b0b24e6a6e  # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@461b3a0906d1a6b1c92f1f21cd4a06b0b24e6a6e  # v3
        with:
          category: /language:${{ matrix.language }}
