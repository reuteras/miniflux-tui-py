name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Automatically increment version based on labels
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'enhancement'
      - 'feature'
  patch:
    labels:
      - 'bugfix'
      - 'fix'
      - 'hotfix'
  default: patch

# Categories for organizing changes
categories:
  - title: '🚀 Major Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🔍 Search & Discovery'
    labels:
      - 'search'
  - title: '🎨 Theme & UI Customization'
    labels:
      - 'theme'
      - 'ui'
  - title: '✅ Testing & Quality'
    labels:
      - 'test'
      - 'testing'
      - 'coverage'
      - 'quality'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bugfix'
      - 'fix'
      - 'hotfix'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '♻️ Refactoring'
    labels:
      - 'refactor'
  - title: '⚙️ Dependencies'
    labels:
      - 'dependencies'
      - 'deps'
  - title: '🔧 Chores'
    labels:
      - 'chore'
      - 'maintenance'

# Template for the release notes
template: |
  # $RELEASE_TITLE

  ## Overview
  This release brings exciting new features, improved test coverage, and better code quality.

  $CHANGES

  ## Compatibility
  - ✅ Python 3.11, 3.12, 3.13, 3.14
  - ✅ Backward compatible with previous versions
  - ✅ All quality checks passing

  ## Installation

  ### Via PyPI
  ```bash
  pip install --upgrade miniflux-tui-py
  ```

  ### From Source
  ```bash
  git clone https://github.com/reuteras/miniflux-tui-py.git
  cd miniflux-tui-py
  uv sync
  uv run miniflux-tui
  ```

  ## Thanks
  Thanks to all contributors for making this release possible! 🎉

# Exclude certain labels/PRs from the changelog
exclude-labels:
  - 'skip-changelog'
  - 'internal'

# Don't include PRs with no labels
include-paths:
  - 'miniflux_tui/**'
  - 'tests/**'
  - 'docs/**'
  - 'pyproject.toml'
  - 'CHANGELOG.md'

replacers:
  - search: '/(?:(?<=\()?#|(?-m)(?=\)))+(?<number>[0-9]+)(?=\))?/g'
    replace: '[#$number](https://github.com/reuteras/miniflux-tui-py/issues/$number)'
